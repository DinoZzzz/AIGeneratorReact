# Only Vite's content-hashed assets are safe to keep immutable across releases.
map $uri $app_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    /index.html "no-cache, no-store, must-revalidate";
    /sw.js "no-cache, no-store, must-revalidate";
    /version.json "no-cache, no-store, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control $app_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.emailjs.com https://*.ingest.de.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default MIME table may omit .mjs. Module workers require JS MIME.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # Missing assets must not fall back to HTML. Keep headers at server scope:
    # location-level add_header would remove the inherited security headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }
}
